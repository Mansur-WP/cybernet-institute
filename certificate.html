<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Certificate | Cybernet Computer Institute</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Certificate Specific Styles */
        :root {
            --cert-gold: #D4AF37;
            --cert-dark: #0F172A;
            --cert-text: #333333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* A4 Landscape Size: 297mm x 210mm */
        /* Responsive scaling container */
        .certificate-container-outer {
            width: 100%;
            max-width: 1122px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            margin: 40px 0;
        }

        /* A4 Landscape Size: 297mm x 210mm (approx 1122px x 793px) */
        .certificate-wrapper {
            width: 297mm;
            height: 210mm;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            padding: 15mm;
            box-sizing: border-box;
            background-image: radial-gradient(circle at center, rgba(212, 175, 55, 0.03) 0%, transparent 70%);
            transform-origin: center center;
            flex-shrink: 0;
        }

        .certificate-border {
            border: 3px solid var(--cert-gold);
            outline: 1px solid var(--cert-gold);
            outline-offset: -10px;
            width: 100%;
            height: 100%;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cert-logo {
            width: 180px;
            margin: 0 auto 20px;
        }

        .cert-title {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: var(--cert-dark);
            margin: 0 0 10px;
            letter-spacing: 4px;
            font-weight: 700;
        }

        .cert-subtitle {
            font-size: 1.2rem;
            color: var(--cert-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .cert-text {
            font-size: 1.2rem;
            color: var(--cert-text);
            margin-bottom: 20px;
        }

        .student-name {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: var(--cert-dark);
            margin: 10px 0 30px;
            line-height: 1;
        }

        .course-name {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--cert-dark);
            margin: 20px 0;
            text-transform: uppercase;
        }

        .cert-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 60px;
            padding: 0 40px;
        }

        .signature-block {
            text-align: center;
            width: 200px;
        }

        .signature-line {
            border-bottom: 1px solid var(--cert-dark);
            margin-bottom: 10px;
            height: 40px; /* Space for signature image if needed */
        }

        .signature-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--cert-text);
            text-transform: uppercase;
        }

        .seal {
            width: 100px;
            height: 100px;
            background: var(--cert-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4);
            border: 2px dashed white;
        }

        .cert-id-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: #888;
            font-family: monospace;
        }

        /* Print Controls */
        .print-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .btn-primary { background: #00AEEF; color: white; }
        .btn-primary:hover { background: #0096ce; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; }
        .btn-outline:hover { background: #f8fafc; }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 600;
            z-index: 50;
        }

        /* Print Styles - crucial for A4 PDF */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .certificate-container-outer {
                margin: 0;
                height: auto !important;
            }
            .certificate-wrapper {
                box-shadow: none;
                width: 297mm;
                height: 210mm;
                transform: none !important;
            }
            .print-controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Controls -->
    <div class="print-controls">
        <button class="btn btn-outline" onclick="window.close()">Close</button>
        <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
    </div>

    <!-- Certificate Render -->
    <div class="certificate-container-outer" id="certificate-container-outer">
        <div class="certificate-wrapper" id="certificate-container">
            <div class="loading-overlay" id="loading-overlay">Verifying Certificate...</div>
            
            <div class="certificate-border">
                <img src="/static/logo.png" alt="Cybernet Logo" class="cert-logo">
                
                <h1 class="cert-title">Certificate of Completion</h1>
                <div class="cert-subtitle">This officially certifies that</div>
                
                <div class="student-name" id="cert-name">Student Name</div>
                
                <div class="cert-text">has successfully completed the comprehensive training requirements for</div>
                
                <div class="course-name" id="cert-course">Course Name</div>
                
                <div class="cert-text" style="margin-top: 10px;">
                    Achieving a grade of: <strong id="cert-grade" style="color: var(--cert-gold);">Distinction</strong>
                </div>

                <div class="cert-footer">
                    <div class="signature-block">
                        <div class="signature-line"></div>
                        <div class="signature-title">Course Instructor</div>
                    </div>
                    
                    <div class="seal">
                        CYBERNET<br>OFFICIAL<br>SEAL
                    </div>
                    
                    <div class="signature-block">
                        <div class="signature-line" style="display: flex; align-items: flex-end; justify-content: center; font-family: monospace; font-size: 1.1rem; padding-bottom: 5px;" id="cert-date">
                            2026-05-18
                        </div>
                        <div class="signature-title">Date Issued</div>
                    </div>
                </div>

                <div class="cert-id-badge" id="cert-id-text">ID: CCI-CERT-00000</div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://kpbcrndtbtpsmqkcsrqf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwYmNybmR0YnRwc21xa2NzcnFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDg0MDEsImV4cCI6MjA5NDU4NDQwMX0.pgTN6cndRWYWSC1XDhvNg6Fb8Y3FqhDEufjlK508SMU';
        let supabase;

        // Responsive A4 scaling logic for screens
        function resizeCertificate() {
            const wrapper = document.getElementById('certificate-container');
            const outer = document.getElementById('certificate-container-outer');
            if (!wrapper || !outer) return;
            
            const baseWidth = 1122; // approx 297mm in pixels
            const containerWidth = outer.clientWidth;
            
            if (containerWidth < baseWidth) {
                const scale = containerWidth / baseWidth;
                wrapper.style.transform = `scale(${scale})`;
                // Calculate correct outer height so space is not wasted
                outer.style.height = `${793 * scale}px`; // 210mm in pixels * scale
            } else {
                wrapper.style.transform = 'none';
                outer.style.height = 'auto';
            }
        }

        async function loadCertificate() {
            const urlParams = new URLSearchParams(window.location.search);
            const certId = urlParams.get('id');

            if (!certId) {
                // If visited directly without an ID, redirect to verify page beautifully
                window.location.href = 'verify.html';
                return;
            }

            try {
                // Initialize Supabase inside the try-catch to catch any library loading errors
                const supabaseLib = window.supabase || (typeof supabase !== 'undefined' ? supabase : null);
                if (!supabaseLib) {
                    throw new Error("Supabase SDK failed to load. Please check your internet connection.");
                }

                supabase = supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { data, error } = await supabase
                    .from('certificates')
                    .select('*')
                    .eq('cert_no', certId)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    // Populate DOM
                    document.getElementById('cert-name').innerText = data.student_name;
                    document.getElementById('cert-course').innerText = data.course;
                    document.getElementById('cert-grade').innerText = data.status || 'Valid';
                    document.getElementById('cert-date').innerText = data.completion_date;
                    document.getElementById('cert-id-text').innerText = 'ID: ' + data.cert_no;
                    
                    // Hide loading overlay
                    document.getElementById('loading-overlay').style.display = 'none';
                    
                    // Trigger responsive scaling
                    resizeCertificate();
                } else {
                    document.getElementById('loading-overlay').innerHTML = "<span style='color:red;'>Certificate Not Found or Invalid.</span>";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading-overlay').innerHTML = `<span style='color:red; font-size:1.1rem; padding:20px; text-align:center;'>Error: ${err.message || err}</span>`;
            }
        }

        // Initialize & Bind Resize (using readyState to prevent DOMContentLoaded race conditions)
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            loadCertificate();
            window.addEventListener('resize', resizeCertificate);
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                loadCertificate();
                window.addEventListener('resize', resizeCertificate);
            });
        }
    </script>
</body>
</html>
